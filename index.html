<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skeleton Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c110e; --panel: #18201b; --fg: #e4ebe6; --muted: #93a198;
    --line: #2c3830; --accent: #5cc98f;
    --left: #ff9f1a; --right: #1a8cff; --center: #50dc50;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "Zen Kaku Gothic New", system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column;
         padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0c110e; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; color: var(--muted);
            font: 500 13px "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center;
           border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 12px; }
  #frame { position: relative; max-width: 100%; max-height: 100%; }
  #frame video, #frame canvas { display: block; max-width: 100%; max-height: calc(100vh - 140px); }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #empty { text-align: center; padding: 32px 16px; display: grid; gap: 12px; justify-items: center; }
  #empty p { margin: 0; color: var(--muted); }
  .mirror { transform: scaleX(-1); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 13px; padding-bottom: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 3px;
         border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Skeleton Tracker</h1>
  <button id="flipBtn" type="button" hidden>カメラ切替</button>
  <select id="modelSel" aria-label="モデル">
    <option value="thunder" selected>Thunder（高精度）</option>
    <option value="lightning">Lightning（高速）</option>
  </select>
  <label>スムージング <input id="smoothRange" type="range" min="0" max="100" value="50"></label>
  <label><input id="bgChk" type="checkbox"> 映像を隠す</label>
  <span id="status">モデル読込中…</span>
</header>
<div id="stage">
  <div id="empty">
    <button id="camBtn" class="primary" type="button" disabled>カメラを起動</button>
    <p>1 人の骨格（17 点）を MoveNet + LiteRT.js で検出し、線でリアルタイム描画します</p>
  </div>
  <div id="frame" hidden>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
</div>
<div class="legend">
  <span style="--c: var(--left)">左半身</span>
  <span style="--c: var(--right)">右半身</span>
  <span style="--c: var(--center)">体幹・顔</span>
</div>

<script type="module">
import { loadLiteRt, loadAndCompile, Tensor, isWebGPUSupported, supportsFeature } from
  "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/+esm";

const WASM_DIR = "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/wasm/";
// MoveNet SinglePose (float16). Input uint8 [1,S,S,3] RGB; output [1,1,17,3] = (y, x, score) in the crop.
const MODELS = {
  thunder: { url: "models/movenet_thunder.tflite", size: 256 },
  lightning: { url: "models/movenet_lightning.tflite", size: 192 },
};
const MIN_CROP_SCORE = 0.2;  // keypoints below this don't steer the crop
const LOST_THR = 0.2;        // mean score below this = person lost, search the whole frame

// COCO 17 keypoints. L = left side, R = right side, C = center.
const L = "#ff9f1a", R = "#1a8cff", C = "#50dc50";
const BONES = [
  [5, 7, L], [7, 9, L], [6, 8, R], [8, 10, R],          // arms
  [11, 13, L], [13, 15, L], [12, 14, R], [14, 16, R],   // legs
  [5, 6, C], [11, 12, C], [5, 11, L], [6, 12, R],       // torso
  [0, 1, C], [0, 2, C], [1, 3, C], [2, 4, C],           // face
];
// Visibility hysteresis so points near the threshold don't blink.
const SHOW_THR = 0.3, HIDE_THR = 0.2;

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const status = $("status");

let model = null, inputSize = 256, accel = "", pre = null, preCtx = null;
const compiled = {};

// ---------- model loading ----------
async function initRuntime() {
  status.textContent = "ランタイム読込中…";
  // JSPI lets LiteRT run unsupported ops on CPU while the rest stays on WebGPU.
  const jspi = await supportsFeature("jspi").catch(() => false);
  await loadLiteRt(WASM_DIR, { jspi });
}

async function compileModel(name) {
  if (compiled[name]) return compiled[name];
  status.textContent = "モデル読込中…";
  const { url } = MODELS[name];
  if (isWebGPUSupported()) {
    try {
      compiled[name] = { m: await loadAndCompile(url, { accelerator: "webgpu" }), accel: "webgpu" };
      return compiled[name];
    } catch (e) { console.warn("WebGPU compile failed, using wasm", e); }
  }
  compiled[name] = { m: await loadAndCompile(url, { accelerator: "wasm" }), accel: "wasm" };
  return compiled[name];
}

async function selectModel(name) {
  model = null;  // pause inference while switching
  const c = await compileModel(name);
  inputSize = MODELS[name].size;
  pre = new OffscreenCanvas(inputSize, inputSize);
  preCtx = pre.getContext("2d", { willReadFrequently: true });
  accel = c.accel;
  crop = null;
  model = c.m;
  status.textContent = running ? "" : `準備完了 (${accel})`;
}

// ---------- inference ----------
let crop = null;  // square region of the video fed to the model: {cx, cy, size} in px

function fullCrop() {
  const W = video.videoWidth, H = video.videoHeight;
  return { cx: W / 2, cy: H / 2, size: Math.max(W, H) };
}

async function estimate(c) {
  const S = inputSize, x0 = c.cx - c.size / 2, y0 = c.cy - c.size / 2;
  preCtx.fillStyle = "#000";
  preCtx.fillRect(0, 0, S, S);
  preCtx.drawImage(video, x0, y0, c.size, c.size, 0, 0, S, S);
  const px = preCtx.getImageData(0, 0, S, S).data;
  const rgb = new Uint8Array(S * S * 3);
  for (let i = 0, j = 0; i < px.length; i += 4, j += 3) {
    rgb[j] = px[i]; rgb[j + 1] = px[i + 1]; rgb[j + 2] = px[i + 2];
  }
  const input = new Tensor(rgb, [1, S, S, 3]);
  let outs;
  try { outs = await model.run(input); } finally { input.delete(); }
  const out = await outs[0].data();
  outs.forEach((t) => t.delete());
  const kps = [];
  for (let k = 0; k < 17; k++) {
    kps.push({ x: x0 + out[3 * k + 1] * c.size, y: y0 + out[3 * k] * c.size, s: out[3 * k + 2] });
  }
  return kps;
}

// Next frame's crop from this frame's keypoints (the MoveNet "smart cropping" recipe):
// center on the hips, size from torso and body extent; fall back to the full frame.
function nextCrop(k) {
  const vis = (i) => k[i].s > MIN_CROP_SCORE;
  if (!((vis(11) || vis(12)) && (vis(5) || vis(6)))) return fullCrop();
  const W = video.videoWidth, H = video.videoHeight;
  const cx = (k[11].x + k[12].x) / 2, cy = (k[11].y + k[12].y) / 2;
  let torso = 0, body = 0;
  for (const i of [5, 6, 11, 12]) torso = Math.max(torso, Math.abs(k[i].x - cx), Math.abs(k[i].y - cy));
  k.forEach((p, i) => { if (vis(i)) body = Math.max(body, Math.abs(p.x - cx), Math.abs(p.y - cy)); });
  let half = Math.max(torso * 1.9, body * 1.2);
  half = Math.min(half, Math.max(cx, W - cx, cy, H - cy));
  if (half * 2 > Math.max(W, H)) return fullCrop();
  return { cx, cy, size: half * 2 };
}

// ---------- smoothing ----------
// One Euro filter (Casiez et al. 2012): heavy smoothing when still, low lag when moving fast.
class OneEuro {
  constructor() { this.x = null; this.dx = 0; this.t = 0; }
  static alpha(cutoff, dt) { const r = 2 * Math.PI * cutoff * dt; return r / (r + 1); }
  filter(x, t, minCutoff, beta) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3);
    this.t = t;
    const dx = (x - this.x) / dt;
    this.dx += OneEuro.alpha(1.0, dt) * (dx - this.dx);
    const cutoff = minCutoff + beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

let filters, shown;
function resetSmoothing() {
  filters = Array.from({ length: 17 }, () => [new OneEuro(), new OneEuro()]);
  shown = new Array(17).fill(false);
}
resetSmoothing();

function smooth(kps, t) {
  // Slider 0..100 → minCutoff 4Hz (light) .. 0.2Hz (heavy). Filter in normalized coords.
  const s = Number($("smoothRange").value) / 100;
  const minCutoff = 4 * Math.pow(0.05, s), beta = 5;
  const W = video.videoWidth, H = video.videoHeight;
  return kps.map((k, i) => {
    shown[i] = shown[i] ? k.s >= HIDE_THR : k.s >= SHOW_THR;
    return {
      x: filters[i][0].filter(k.x / W, t, minCutoff, beta) * W,
      y: filters[i][1].filter(k.y / H, t, minCutoff, beta) * H,
      ok: shown[i],
    };
  });
}

// ---------- drawing ----------
function draw(pts) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if ($("bgChk").checked) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }
  if (!pts) return;
  const lw = Math.max(2, w / 200), r = lw * 1.2;
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  for (const [a, b, color] of BONES) {
    if (!pts[a].ok || !pts[b].ok) continue;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
    ctx.stroke();
  }
  ctx.fillStyle = "#fff";
  for (const p of pts) {
    if (!p.ok) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- main loop ----------
let busy = false, lastVideoTime = -1, fps = 0, lastT = 0;

async function step() {
  const t = performance.now();
  if (!crop) { crop = fullCrop(); resetSmoothing(); }
  const kps = await estimate(crop);
  const mean = kps.reduce((s, k) => s + k.s, 0) / kps.length;
  if (mean < LOST_THR) { crop = null; draw(null); return; }
  crop = nextCrop(kps);
  draw(smooth(kps, t));
}

function loop() {
  if (model && !busy && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }
    busy = true;
    step()
      .then(() => {
        const now = performance.now();
        if (lastT) fps = fps ? fps * 0.9 + 100 / (now - lastT) : 1000 / (now - lastT);
        lastT = now;
        status.textContent = `${fps.toFixed(1)} FPS · ${accel}`;
      })
      .catch((e) => { console.error(e); status.textContent = `推論エラー: ${e.message}`; })
      .finally(() => { busy = false; });
  }
  requestAnimationFrame(loop);
}

// ---------- camera ----------
let facing = "user", running = false;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 },
               frameRate: { ideal: 60 } },
      audio: false,
    });
    video.srcObject?.getTracks().forEach((t) => t.stop());
    video.srcObject = stream;
    await video.play();
    const mirror = facing === "user";
    video.classList.toggle("mirror", mirror);
    canvas.classList.toggle("mirror", mirror);
    $("empty").hidden = true;
    $("frame").hidden = false;
    crop = null; lastVideoTime = -1; lastT = 0; fps = 0;
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    $("flipBtn").hidden = cams.length < 2;
    if (!running) { running = true; requestAnimationFrame(loop); }
  } catch (e) {
    status.textContent =
      e.name === "NotAllowedError" ? "カメラが許可されていません。ブラウザの設定で許可してください"
      : e.name === "NotReadableError" ? "カメラを他のアプリ（ビデオ通話など）が使用中です"
      : `カメラを起動できません: ${e.message}`;
  }
}

$("camBtn").onclick = startCamera;
$("flipBtn").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCamera(); };
$("modelSel").onchange = () => {
  lastT = 0;
  selectModel($("modelSel").value).catch((e) => { status.textContent = `モデル読込失敗: ${e.message}`; });
};

initRuntime()
  .then(() => selectModel($("modelSel").value))
  .then(() => { $("camBtn").disabled = false; })
  .catch((e) => { console.error(e); status.textContent = `読込失敗: ${e.message}`; });
</script>
</body>
</html>
