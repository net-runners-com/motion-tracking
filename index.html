<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skeleton Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c110e; --panel: #18201b; --fg: #e4ebe6; --muted: #93a198;
    --line: #2c3830; --accent: #5cc98f;
    --left: #ff9f1a; --right: #1a8cff; --center: #50dc50;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "Zen Kaku Gothic New", system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column;
         padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0c110e; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; color: var(--muted);
            font: 500 13px "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center;
           border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 12px; }
  #frame { position: relative; max-width: 100%; max-height: 100%; }
  #frame video, #frame canvas { display: block; max-width: 100%; max-height: calc(100vh - 140px); }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #empty { text-align: center; padding: 32px 16px; display: grid; gap: 12px; justify-items: center; }
  #empty p { margin: 0; color: var(--muted); }
  .mirror { transform: scaleX(-1); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 13px; padding-bottom: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 3px;
         border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Skeleton Tracker</h1>
  <button id="flipBtn" type="button" hidden>カメラ切替</button>
  <label>スムージング <input id="smoothRange" type="range" min="0" max="100" value="50"></label>
  <label><input id="bgChk" type="checkbox"> 映像を隠す</label>
  <span id="status">モデル読込中…</span>
</header>
<div id="stage">
  <div id="empty">
    <button id="camBtn" class="primary" type="button" disabled>カメラを起動</button>
    <p>一番近くにいる 1 人の骨格（17 点）を RTMPose で検出し、線でリアルタイム描画します<br>
       初回はモデル（約 75MB）のダウンロードに時間がかかります</p>
  </div>
  <div id="frame" hidden>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
</div>
<div class="legend">
  <span style="--c: var(--left)">左半身</span>
  <span style="--c: var(--right)">右半身</span>
  <span style="--c: var(--center)">体幹・顔</span>
</div>

<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.mjs";
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";

// Person detector (YOLOX-tiny, HumanArt) + top-down pose (RTMPose-m, Body7, 256x192).
const DET_URL = "models/yolox-tiny-humanart.onnx";
const POSE_URL = "models/rtmpose-m-body7.onnx";
const DET_SIZE = 416, DET_THR = 0.4;
const POSE_W = 192, POSE_H = 256, SIMCC_SPLIT = 2;
const MEAN = [123.675, 116.28, 103.53], STD = [58.395, 57.12, 57.375];
const REDETECT_EVERY = 30;   // frames; re-pick the closest person periodically
const LOST_THR = 0.3;        // mean keypoint score below this = person lost

// COCO 17 keypoints. L = left side, R = right side, C = center.
const L = "#ff9f1a", R = "#1a8cff", C = "#50dc50";
const BONES = [
  [5, 7, L], [7, 9, L], [6, 8, R], [8, 10, R],          // arms
  [11, 13, L], [13, 15, L], [12, 14, R], [14, 16, R],   // legs
  [5, 6, C], [11, 12, C], [5, 11, L], [6, 12, R],       // torso
  [0, 1, C], [0, 2, C], [1, 3, C], [2, 4, C],           // face
];
// Visibility hysteresis so points near the threshold don't blink.
const SHOW_THR = 0.4, HIDE_THR = 0.25;

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const status = $("status");

const detCv = new OffscreenCanvas(DET_SIZE, DET_SIZE);
const detCtx = detCv.getContext("2d", { willReadFrequently: true });
const poseCv = new OffscreenCanvas(POSE_W, POSE_H);
const poseCtx = poseCv.getContext("2d", { willReadFrequently: true });

let detSess, poseSess, backend = "";

// ---------- model loading ----------
async function fetchModel(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const total = Number(res.headers.get("content-length")) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    onProgress(got, total);
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf;
}

async function createSession(buf) {
  if ("gpu" in navigator) {
    try {
      const s = await ort.InferenceSession.create(buf, { executionProviders: ["webgpu", "wasm"] });
      backend = "webgpu";
      return s;
    } catch (e) { console.warn("webgpu failed, falling back to wasm", e); }
  }
  backend = "wasm";
  return ort.InferenceSession.create(buf, { executionProviders: ["wasm"] });
}

async function loadModels() {
  const sizes = { det: [0, 0], pose: [0, 0] };
  const show = () => {
    const got = sizes.det[0] + sizes.pose[0], tot = sizes.det[1] + sizes.pose[1];
    status.textContent = tot ? `モデル読込中 ${Math.floor(100 * got / tot)}%` : "モデル読込中…";
  };
  const [detBuf, poseBuf] = await Promise.all([
    fetchModel(DET_URL, (g, t) => { sizes.det = [g, t]; show(); }),
    fetchModel(POSE_URL, (g, t) => { sizes.pose = [g, t]; show(); }),
  ]);
  status.textContent = "モデル初期化中…";
  detSess = await createSession(detBuf);
  poseSess = await createSession(poseBuf);
  status.textContent = `準備完了 (${backend})`;
  $("camBtn").disabled = false;
}

// ---------- inference ----------
// Returns person boxes [x1, y1, x2, y2, score] in video pixels.
async function detect() {
  const W = video.videoWidth, H = video.videoHeight;
  const r = Math.min(DET_SIZE / W, DET_SIZE / H);
  detCtx.fillStyle = "rgb(114,114,114)";
  detCtx.fillRect(0, 0, DET_SIZE, DET_SIZE);
  detCtx.drawImage(video, 0, 0, Math.round(W * r), Math.round(H * r));
  const px = detCtx.getImageData(0, 0, DET_SIZE, DET_SIZE).data;
  const n = DET_SIZE * DET_SIZE, input = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {        // BGR, 0-255, CHW
    input[i] = px[4 * i + 2];
    input[n + i] = px[4 * i + 1];
    input[2 * n + i] = px[4 * i];
  }
  const out = await detSess.run({ input: new ort.Tensor("float32", input, [1, 3, DET_SIZE, DET_SIZE]) });
  const dets = out.dets.data, labels = out.labels.data, boxes = [];
  for (let i = 0; i < labels.length; i++) {
    const s = dets[5 * i + 4];
    if (Number(labels[i]) !== 0 || s < DET_THR) continue;
    boxes.push([dets[5 * i] / r, dets[5 * i + 1] / r, dets[5 * i + 2] / r, dets[5 * i + 3] / r, s]);
  }
  return boxes;
}

// Returns 17 keypoints {x, y, s} in video pixels for the given box.
async function estimate(box) {
  const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
  let w = (box[2] - box[0]) * 1.25, h = (box[3] - box[1]) * 1.25;
  if (w / h > POSE_W / POSE_H) h = w * POSE_H / POSE_W; else w = h * POSE_W / POSE_H;
  const sx = cx - w / 2, sy = cy - h / 2;
  poseCtx.fillStyle = "#000";
  poseCtx.fillRect(0, 0, POSE_W, POSE_H);
  poseCtx.drawImage(video, sx, sy, w, h, 0, 0, POSE_W, POSE_H);
  const px = poseCtx.getImageData(0, 0, POSE_W, POSE_H).data;
  const n = POSE_W * POSE_H, input = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {        // RGB, normalized, CHW
    input[i] = (px[4 * i] - MEAN[0]) / STD[0];
    input[n + i] = (px[4 * i + 1] - MEAN[1]) / STD[1];
    input[2 * n + i] = (px[4 * i + 2] - MEAN[2]) / STD[2];
  }
  const out = await poseSess.run({ input: new ort.Tensor("float32", input, [1, 3, POSE_H, POSE_W]) });
  const X = out.simcc_x.data, Y = out.simcc_y.data;
  const nx = POSE_W * SIMCC_SPLIT, ny = POSE_H * SIMCC_SPLIT, kps = [];
  for (let k = 0; k < 17; k++) {
    let bx = 0, vx = -Infinity, by = 0, vy = -Infinity;
    for (let j = 0; j < nx; j++) { const v = X[k * nx + j]; if (v > vx) { vx = v; bx = j; } }
    for (let j = 0; j < ny; j++) { const v = Y[k * ny + j]; if (v > vy) { vy = v; by = j; } }
    kps.push({
      x: sx + (bx / SIMCC_SPLIT) / POSE_W * w,
      y: sy + (by / SIMCC_SPLIT) / POSE_H * h,
      s: Math.min(vx, vy),
    });
  }
  return kps;
}

// ---------- tracking (single person, closest = largest box) ----------
const area = (b) => (b[2] - b[0]) * (b[3] - b[1]);
function iou(a, b) {
  const w = Math.min(a[2], b[2]) - Math.max(a[0], b[0]);
  const h = Math.min(a[3], b[3]) - Math.max(a[1], b[1]);
  if (w <= 0 || h <= 0) return 0;
  const i = w * h;
  return i / (area(a) + area(b) - i);
}

// Pick the largest person; keep the current one unless someone is clearly closer.
function choose(boxes, current) {
  if (!boxes.length) return null;
  const largest = boxes.reduce((a, b) => (area(b) > area(a) ? b : a));
  if (!current) return largest;
  const same = boxes.reduce((a, b) => (iou(b, current) > iou(a, current) ? b : a));
  if (iou(same, current) < 0.3) return largest;
  return area(largest) > area(same) * 1.2 ? largest : same;
}

function boxFromKeypoints(kps) {
  const ok = kps.filter((k) => k.s >= LOST_THR);
  if (ok.length < 4) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const k of ok) { x1 = Math.min(x1, k.x); y1 = Math.min(y1, k.y); x2 = Math.max(x2, k.x); y2 = Math.max(y2, k.y); }
  // Keypoints don't reach the top of the head or the soles; widen a little.
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, w = (x2 - x1) * 1.1, h = (y2 - y1) * 1.15;
  return [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
}

// ---------- smoothing ----------
// One Euro filter (Casiez et al. 2012): heavy smoothing when still, low lag when moving fast.
class OneEuro {
  constructor() { this.x = null; this.dx = 0; this.t = 0; }
  static alpha(cutoff, dt) { const r = 2 * Math.PI * cutoff * dt; return r / (r + 1); }
  filter(x, t, minCutoff, beta) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3);
    this.t = t;
    const dx = (x - this.x) / dt;
    this.dx += OneEuro.alpha(1.0, dt) * (dx - this.dx);
    const cutoff = minCutoff + beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

let filters, shown;
function resetSmoothing() {
  filters = Array.from({ length: 17 }, () => [new OneEuro(), new OneEuro()]);
  shown = new Array(17).fill(false);
}
resetSmoothing();

function smooth(kps, t) {
  // Slider 0..100 → minCutoff 4Hz (light) .. 0.2Hz (heavy). Filter in normalized coords.
  const s = Number($("smoothRange").value) / 100;
  const minCutoff = 4 * Math.pow(0.05, s), beta = 5;
  const W = video.videoWidth, H = video.videoHeight;
  return kps.map((k, i) => {
    shown[i] = shown[i] ? k.s >= HIDE_THR : k.s >= SHOW_THR;
    return {
      x: filters[i][0].filter(k.x / W, t, minCutoff, beta) * W,
      y: filters[i][1].filter(k.y / H, t, minCutoff, beta) * H,
      ok: shown[i],
    };
  });
}

// ---------- drawing ----------
function draw(pts) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if ($("bgChk").checked) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h); }
  if (!pts) return;
  const lw = Math.max(2, w / 200), r = lw * 1.2;
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  for (const [a, b, color] of BONES) {
    if (!pts[a].ok || !pts[b].ok) continue;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
    ctx.stroke();
  }
  ctx.fillStyle = "#fff";
  for (const p of pts) {
    if (!p.ok) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- main loop ----------
let box = null, frameNo = 0, busy = false, lastVideoTime = -1, fps = 0, lastT = 0;

async function step() {
  const t = performance.now();
  if (!box || frameNo % REDETECT_EVERY === 0) {
    const next = choose(await detect(), box);
    if (!next) { box = null; draw(null); return; }
    if (!box || iou(next, box) < 0.3) resetSmoothing();  // a different person
    box = next;
  }
  const kps = await estimate(box);
  const mean = kps.reduce((s, k) => s + k.s, 0) / kps.length;
  if (mean < LOST_THR) { box = null; draw(null); return; }
  box = boxFromKeypoints(kps);
  draw(smooth(kps, t));
}

function loop() {
  if (!busy && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }
    busy = true;
    step()
      .then(() => {
        const now = performance.now();
        if (lastT) fps = fps ? fps * 0.9 + 100 / (now - lastT) : 1000 / (now - lastT);
        lastT = now;
        status.textContent = `${fps.toFixed(1)} FPS · ${backend}`;
      })
      .catch((e) => { console.error(e); status.textContent = `推論エラー: ${e.message}`; })
      .finally(() => { busy = false; frameNo++; });
  }
  requestAnimationFrame(loop);
}

// ---------- camera ----------
let facing = "user", running = false;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 },
               frameRate: { ideal: 60 } },
      audio: false,
    });
    video.srcObject?.getTracks().forEach((t) => t.stop());
    video.srcObject = stream;
    await video.play();
    const mirror = facing === "user";
    video.classList.toggle("mirror", mirror);
    canvas.classList.toggle("mirror", mirror);
    $("empty").hidden = true;
    $("frame").hidden = false;
    box = null; lastVideoTime = -1; lastT = 0; fps = 0;
    resetSmoothing();
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    $("flipBtn").hidden = cams.length < 2;
    if (!running) { running = true; requestAnimationFrame(loop); }
  } catch (e) {
    status.textContent =
      e.name === "NotAllowedError" ? "カメラが許可されていません。ブラウザの設定で許可してください"
      : e.name === "NotReadableError" ? "カメラを他のアプリ（ビデオ通話など）が使用中です"
      : `カメラを起動できません: ${e.message}`;
  }
}

$("camBtn").onclick = startCamera;
$("flipBtn").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCamera(); };

loadModels().catch((e) => { console.error(e); status.textContent = `モデル読込失敗: ${e.message}`; });
</script>
</body>
</html>
